	  $.ajax({
  url: "api/mealplanner.cfc?method=getMeals",
  method: "GET",
  dataType: "json",
  success: function(meals) {
    $("#external-events").empty().append("<h4>Available Meals</h4>");
    
    $.each(meals, function(i, meal) {
      var mealElement = $("<div class='fc-event fc-h-event fc-daygrid-event fc-daygrid-block-event'>")
        .append("<div class='fc-event-main' data-meal-id='" + meal.id + "' data-servings='" + meal.servings + "'>" + meal.title + "</div>");
      
      $("#external-events").append(mealElement);
    });

    // Make meals draggable with FullCalendar event data
    new Draggable(containerEl, {
      itemSelector: '.fc-event',
      eventData: function(eventEl) {
        return {
          title: $(eventEl).text(),
          extendedProps: {
            mealId: $(eventEl).find(".fc-event-main").data("meal-id"),
            servings: $(eventEl).find(".fc-event-main").data("servings")
          }
        };
      }
    });
  }
});


	  // Initialize the calendar
		var calendar = new FullCalendar.Calendar(calendarEl, {
		  headerToolbar: {
		    left: 'prev,next today',
		    center: 'title',
		    right: 'dayGridMonth,timeGridWeek,timeGridDay'
		  },
		   editable: true,
		   droppable: true, 
			 eventReceive: function(info) {
  var mealId = info.event.extendedProps.mealId;
  var mealTitle = info.event.title;
  var servings = info.event.extendedProps.servings;

  if (!mealId || !servings) {
    console.error("Meal ID or servings missing—check draggable assignment.");
    return;
  }

  var numMeals = Math.ceil(servings / 2); // Determine meal span

  // Expand meal across calculated days
  var newEndDate = new Date(info.event.start);
  newEndDate.setDate(newEndDate.getDate() + numMeals);
  info.event.setEnd(newEndDate);

  // Save meal placement
  saveMealPlacement(mealId, info.event.startStr, info.event.endStr);

  // **Ensure delete event binding happens immediately**
  setTimeout(() => {
    var trashIcon = $(info.el).find(".delete-event");
    trashIcon.click(function() {
      Swal.fire({
        title: "Delete Meal?",
        text: "This will remove the meal from the calendar.",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Yes, delete it"
      }).then((result) => {
        if (result.isConfirmed) {
          info.event.remove();
          deleteMealPlacement(info.event.extendedProps.mealId);
        }
      });
    });
  }, 0);
}
,
			  eventDrop: function(info) {
			    var mealId = info.event.extendedProps.mealId;
			    saveMealPlacement(mealId, info.event.startStr, info.event.endStr);
			  },
				// Override default event rendering
			  eventContent: function(info) {
			    var mealTitle = $("<span class='meal-title'>" + info.event.title + "</span><span class='delete-event'>&#128465;</span>");
			    

			    var container = $("<div class='event-container'>").css({
			      "display": "flex",
			      "align-items": "center",
			      "justify-content": "space-between"
			    }).append(mealTitle);

			    return { domNodes: [container[0]] }; // Return custom content
			  },

			  // Handle event deletion when clicking the trash icon
			  eventDidMount: function(info) {
  var trashIcon = $(info.el).find(".delete-event");

  // Use event delegation to ensure the click function is bound globally
  $(info.el).on("click", ".delete-event", function() {
    Swal.fire({
      title: "Delete Meal?",
      text: "This will remove the meal from the calendar.",
      icon: "warning",
      showCancelButton: true,
      confirmButtonText: "Yes, delete it"
    }).then((result) => {
      if (result.isConfirmed) {
        info.event.remove();
        deleteMealPlacement(info.event.extendedProps.mealId);
      }
    });
  });
}



				
				
		});

		calendar.render();

      }

      function deleteMealPlacement(mealId) {
      	Swal.fire({
				  title: "Good job!",
				  text: "deleteMealPlacement " + mealId,

				});

	});


</script>
