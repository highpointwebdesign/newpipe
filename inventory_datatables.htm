<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingredient Inventory</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
  <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/rowreorder/1.3.3/css/rowReorder.dataTables.min.css">
  <style>
    /* Style for the drag handle */
    .drag-handle {
      cursor: move;
      font-size: 20px;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h1>Ingredient Inventory</h1>
    <table id="inventoryTable" class="table table-striped">
      <thead>
        <tr>
          <th style="width: 30px;"></th> <!-- Drag handle column -->
          <!-- <th>ID</th> -->
          <th>Ingredient Name</th>
          <th>Quantity On Hand</th>
          <th>Desired Inventory Level</th>
          <th>To Buy</th>
        </tr>
      </thead>
      <tbody>
        <!-- Data will be populated via AJAX -->
      </tbody>
    </table>
  </div>
  
  <!-- Required Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/rowreorder/1.3.3/js/dataTables.rowReorder.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>


  <script>
    $(document).ready(function() {
    var table = $('#inventoryTable').DataTable({
      rowReorder: {
        snapX: 10
      },
      ajax: '/api/mealplanner.cfc?method=getInventory&cb=1',  
      columns: [
        { data: 'sort_order' },
        { data: 'ingredient_name' },
        { 
          data: 'quantity_on_hand',
          render: function(data, type, row) {
            // Create inline editing input for quantity on hand.
            return '<input type="number" class="form-control quantity-input" data-id="' + row.id + '" value="' + data + '" min="0">';
          }
        },
        { 
          data: 'desired_inventory_level',
          render: function(data, type, row) {
            // Create inline editing input for desired level.
            return '<input type="number" class="form-control desired-input" data-id="' + row.id + '" value="' + data + '" min="0">';
          }
        },
        { 
          data: null,
          render: function(data, type, row) {
            // The "To Buy" value is computed based on the other two values.
            var toBuy = Math.max(row.desired_inventory_level - row.quantity_on_hand, 0);
            return '<span class="to-buy" data-id="' + row.id + '">' + toBuy + '</span>';
          }
        }
    ],
    rowReorder: {
        dataSrc: 'sort_order'
    }
});

    $('#inventoryTable').on('row-reorder.dt', function(e, diff, edit) {
          console.log('Row reorder event fired.');
          var orderData = [];
          $('#inventoryTable tbody tr').each(function(index) {
              var rowData = table.row(this).data();
              orderData.push({ id: rowData.id, newOrder: index + 1 });
          });
          console.log('Updated Order Data:', JSON.stringify(orderData));
          
          // Send the reordering information to the server.
          $.ajax({
              url: '/api/mealplanner.cfc?method=updateOrder',
              type: 'POST',
              dataType: "json",
              data: { order: JSON.stringify(orderData) },
              success: function(response) {
                  console.log("Order update response:", response);
              },
              error: function(err) {
                  console.error("Error updating order:", err);
              }
          });
      });

     // Inline editing: update "To Buy" dynamically when inputs change.
      $('#inventoryTable tbody').on('change', '.quantity-input, .desired-input', function() {
          var $row = $(this).closest('tr');
          var quantity = parseInt($row.find('.quantity-input').val(), 10) || 0;
          var desired = parseInt($row.find('.desired-input').val(), 10) || 0;
          var updatedToBuy = Math.max(desired - quantity, 0);
          $row.find('.to-buy').text(updatedToBuy);
          
          // Optionally, send an AJAX update for the inline edit immediately.
          // var ingredientId = $(this).data('id');
          // var field = $(this).hasClass('quantity-input') ? 'quantity_on_hand' : 'desired_inventory_level';
          // var newValue = field === 'quantity_on_hand' ? quantity : desired;
          // $.ajax({ url: '/api/mealplanner.cfc?method=updateInventory', type: 'POST', data: { id: ingredientId, field: field, value: newValue } });
      });
    });
  </script>
</body>
</html>
