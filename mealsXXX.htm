<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!--- select2 --->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <!--- datatables --->
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.10.24/css/dataTables.bootstrap5.min.css">
    <!-- font-awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- select2 -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">

    <style>
    .delete-icon {
        position: absolute;
        right: 15px;
        top: 15px;
        font-size: 20px;
        color: #dc3545; /* Red */
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
    }

    .card:hover .delete-icon {
        opacity: 1; /* Show when hovering */
    }

    /*  select2 and modal fix  */
    .select2-container {
        z-index: 9999 !important; /* Ensures dropdown appears above modal */
    }

    /*    select2 styling overrides*/
    .select2-container .select2-selection--single {
        height: calc(2.25rem + 2px) !important; /* Same height as Bootstrap input */
        padding: 0.375rem 0.75rem !important; /* Standard Bootstrap padding */
        border: 1px solid #ced4da !important; /* Matches Bootstrap input border */
        border-radius: 0.375rem !important; /* Bootstrap input rounding */
    }
    .select2-container .select2-selection--single:focus {
        border-color: #86b7fe !important; /* Bootstrap's primary focus color */
        outline: 0 !important;
        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25) !important; /* Bootstrap 5 focus shadow */
    }
    .select2-container .select2-selection__placeholder {
        color: #6c757d !important; /* Bootstrap muted text */
    }
    .select2-dropdown {
        border: 1px solid #ced4da !important; /* Match Bootstrap */
        border-radius: 0.375rem !important; /* Rounded corners */
    }

    </style>

</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">Meal Planner</h1>
    <div class="d-flex justify-content-center gap-3 mb-4">
      <a href="/" class="btn btn-outline-secondary">Home</a>
      <button class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#createMealModal">Add a Meal</button>
      <a href="/mealShoppingCart.htm" class="btn btn-outline-secondary">Shopping Cart</a>
    </div>

    <!-- Meal Cards Container -->
    <div id="mealCards" class="row g-4">
      <!-- Cards will be injected here -->
    </div>
  </div>




    <!-- Bootstrap 5 JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Your custom JS -->
    <!-- <script src="js/copilot.js"></script> -->
    <!--- sweet alert --->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!--- datables --->
    <script type="text/javascript" src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.min.js"></script>
    <script type="text/javascript" src="https://cdn.datatables.net/1.10.24/js/dataTables.bootstrap5.min.js"></script>
    <!-- select2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>




  <!-- Create Meal Modal -->
  <div class="modal fade" id="createMealModal" tabindex="-1" aria-labelledby="createMealModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="createMealModalLabel">Add a Meal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="mealForm">
            <div class="mb-3">
              <label for="mealName" class="form-label">Meal Name</label>
              <input type="text" class="form-control" id="mealName" name="mealName" required>
            </div>

            <hr style="color:navy">

            <div id="ingredientsContainer">
            </div>

            <button type="button" class="btn btn-outline-primary" id="addIngredient">Add Ingredient</button>
            <button type="submit" class="btn btn-success">Save Meal</button>
          </form>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/meals.js?version=1.1"></script>
</body>
</html>
